# ротация логов контейнеров: без неё json-логи растут бесконечно и забивают диск VPS
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  front:
    build: 
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_MAP_API_KEY: ${VITE_MAP_API_KEY}
    container_name: front
    logging: *default-logging
    volumes:
      - front_build:/srv/front
    networks:
      - app-net
    depends_on:
      - back
    restart: no # one time run for build volume content

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: back
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - DB_HOST=mongo
    env_file:
      - ./.env
    volumes:
      - ./static:/static
      - front_build:/srv/front:ro # index.html for per-page meta tags
    networks:
      - app-net
    restart: always
    depends_on:
      - mongo

  mongo:
    image: mongo:9.0.2
    container_name: mongo
    logging: *default-logging
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    command: ["--auth", "--bind_ip", "0.0.0.0"]
    volumes:
      - ./mongo/db_dump:/data/db
    restart: always
    networks:
      - app-net

  caddy:
    image: caddy:2.11.7
    container_name: caddy
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - front_build:/srv/front
      - yuding_build:/srv/yuding
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-net
    depends_on:
      - front
      - back
    restart: unless-stopped

  yuding:
    build: 
      context: ./yuding
      dockerfile: Dockerfile
    container_name: yuding
    logging: *default-logging
    restart: no # one time run for build volume content
    volumes:
      - yuding_build:/srv/yuding

volumes:
  front_build:
  yuding_build:
  caddy_data:
  caddy_config:

networks:
  app-net:
    name: app-net
    driver: bridge
