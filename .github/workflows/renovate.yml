name: Renovate

on:
  schedule:
    # Saturday 00:00 (UTC+5) = Friday 19:00 UTC
    - cron: '0 19 * * 5'
  workflow_dispatch:
  workflow_run:
    workflows: ['CI Front', 'CI Back', 'CI Docs', 'CI Yuding']
    types: [completed]

jobs:
  renovate:
    runs-on: ubuntu-latest
    # re-run automerge only when CI just went green on a renovate branch;
    # schedule/manual triggers always run regardless
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'renovate/'))
    # один PR запускает CI нескольких проектов, и они завершаются почти одновременно —
    # ставим запуски в очередь, чтобы не толкались на одних ветках.
    # На уровне job, а не workflow: иначе пропущенные по if запуски вытесняли бы из очереди настоящие
    concurrency:
      group: renovate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        env:
          # глобальная опция: в renovate.json её нельзя — он же читается как конфиг репозитория
          RENOVATE_REPOSITORIES: ivan-lev/kamamoto
        with:
          token: '${{ secrets.RENOVATE_TOKEN }}'
