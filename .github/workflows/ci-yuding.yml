name: CI Yuding

on:
  pull_request:
    branches: [main]
    paths:
      - 'yuding/**'
      # сборка общая — правки в ней (в т.ч. бампы actions от Renovate) проверяем на каждом проекте
      - '.github/workflows/_build.yml'
      - '.github/workflows/ci-yuding.yml'

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      project: yuding
